# GitHub Pages 자동 배포: 이 브랜치에 푸시하면 빌드해서 https://vecar0.github.io/Sniper/ 에 올린다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번 설정해야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/sniper-game]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # LAST NODE(빌드 도구 없는 정적 게임)는 폴더째 복사 → /Sniper/last-node/
      - run: mkdir -p dist/last-node && cp -r last-node/index.html last-node/css last-node/js last-node/vendor last-node/fonts last-node/textures dist/last-node/
      # 부스 호출 버튼(파일 하나) → /Sniper/booth-call/
      - run: mkdir -p dist/booth-call && cp booth-call/index.html dist/booth-call/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
