<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d0f" />
    <meta name="description" content="LONG SHOT – 바람과 거리를 읽고 한 발로 끝내는 전술 저격 암살 게임 (3D 브라우저 게임)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>LONG SHOT – 고스트 프로토콜</title>
    <style>
      /* JS가 실행되기 전에도 빈 화면이 보이지 않도록 로딩 화면 스타일은 인라인 */
      html, body { margin: 0; height: 100%; background: #090d0f; color: #e8eef2; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #090d0f repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px); transition: opacity 0.45s; }
      #loading.done { opacity: 0; pointer-events: none; }
      .loading-title { font-size: 34px; font-weight: 800; letter-spacing: 0.18em; }
      .loading-title span { color: #e8a33d; }
      .loading-sub { font: 12px ui-monospace, monospace; letter-spacing: 0.3em; color: #e8a33d; margin-top: -10px; }
      .loading-bar { width: min(320px, 70vw); height: 3px; background: #1d2725; overflow: hidden; }
      .loading-bar i { display: block; height: 100%; background: #e8a33d; transform: scaleX(0.05); transform-origin: left; transition: transform 0.25s; }
      .loading-text { font-size: 14px; color: #9fb0bf; }
      #fatal { position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #090d0f; }
      #fatal button { font: inherit; padding: 10px 20px; border-radius: 4px; border: 0; background: #e8a33d; color: #111; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game"></div>
    </div>
    <div id="loading" role="progressbar" aria-label="불러오는 중">
      <div class="loading-title">LONG<span>·</span>SHOT</div>
      <div class="loading-sub">GHOST PROTOCOL</div>
      <div class="loading-bar"><i></i></div>
      <div class="loading-text">불러오는 중…</div>
    </div>
    <div id="fatal" role="alert">
      <h2>문제가 발생했습니다</h2>
      <p class="fatal-msg"></p>
      <button onclick="location.reload()">새로고침</button>
    </div>
    <noscript>이 게임을 실행하려면 JavaScript가 필요합니다.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
