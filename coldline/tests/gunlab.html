<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>총 모델 확인</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js" } }</script>
</head>
<body>
<script type="module">
// 개발용: ?gun=rifle&yaw=0.6&pitch=0.2&dist=1.1 — 총 하나를 어두운 배경에서 돌려 본다(손·재질·윤곽 검수)
import * as THREE from 'three';
import { gunMaterials, viewmodelEnvironment, buildGun, viewmodelLights, shadowGun, placeBoltHand } from '../js/render/guns.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.setPixelRatio(1);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101318);
const env = viewmodelEnvironment(r);
scene.environment = env;
viewmodelLights(scene);
const M = gunMaterials(env);
const ammo = new THREE.MeshBasicMaterial({ color: 0x223322 });
const gun = buildGun(q.get('gun') || 'rifle', M, { ammoMat: ammo, reticleMat: ammo, scopeMat: ammo });
scene.add(gun.group); shadowGun(gun.group);
if (q.get('xray')) { const skip = new Set(); for (const h of [gun.leftHand, gun.rightHand, gun.leftArm, gun.rightArm]) if (h) h.traverse((o) => skip.add(o)); gun.group.traverse((o) => { if (o.isMesh && !skip.has(o)) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.25; o.material.depthWrite = false; } }); }
if (q.get('bolt') && gun.bolt98) { const [rz, pz] = q.get('bolt').split(',').map(Number); gun.bolt98.rotation.z = rz; gun.bolt98.position.z = pz; }
if (q.get('bg') && gun.boltHand) { const v = q.get('bg') === '1' ? null : q.get('bg').split(',').map(Number); placeBoltHand(gun.rightHand, gun.bolt98, v ? { index: v.slice(0, 3), pinky: v.slice(3, 6), wrist: v.slice(6, 9) } : gun.boltHand, gun.boltKnob); }
if (q.get("noarms")) gun.group.traverse((o) => { if (o.userData && o.userData.rig) o.visible = false; });
if (q.get("noarm")) gun.group.traverse((o) => { if (o.isMesh && [M.sleeve, M.glove, M.knuckle].includes(o.material)) o.visible = false; });
const box = new THREE.Box3(); gun.group.updateMatrixWorld(true); gun.group.traverse((o) => { if (o.isMesh && o.visible && o.parent.visible) box.expandByObject(o); }); const c = q.get("tgt") ? new THREE.Vector3(...q.get("tgt").split(",").map(Number)) : box.getCenter(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(q.get('fp') ? 54 : 30, innerWidth / innerHeight, 0.01, 20);
const yaw = +(q.get('yaw') ?? 1.2), pitch = +(q.get('pitch') ?? 0.15), dist = +(q.get('dist') ?? 1.4);
if (q.get('fp')) { // 플레이어 눈: 허리 사격 위치의 반대(fp=x,y,z)
  const [x, y, z] = q.get('fp').split(',').map(Number);
  cam.position.set(-x, -y, -z); cam.lookAt(-x, -y, -z - 1);
} else {
  cam.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * dist, c.y + Math.sin(pitch) * dist, c.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  cam.lookAt(c);
}
r.render(scene, cam);
window.__tris = r.info.render.triangles + " calls " + r.info.render.calls;
window.__done = true;
</script>
</body>
</html>
